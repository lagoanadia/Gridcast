# Scheduler: every 5 minutes, ask the deployed app to publish whatever is due (and renew Instagram tokens).
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   Variable APP_URL     e.g. https://gridcast-schedule.vercel.app
#   Secret   CRON_SECRET the same value as the CRON_SECRET environment variable in Vercel
# GitHub only runs schedules from the default branch and may delay them a few minutes under load.
name: Scheduler tick
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/tick
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL variable or CRON_SECRET secret is not set; nothing to do."
            exit 0
          fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/tick"
